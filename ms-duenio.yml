spring:
  datasource:
    url: jdbc:mysql://localhost:3306/dueno_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: root
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,env,beans,mappings

  endpoint:
    health:
      show-details: always

    env:
      access: unrestricted

info:
  app:
    name: ms-duenio
    description: Microservicio de gestión de dueños
    version: 1.0.0
