
server:
  port: 8084

spring:
  application:
    name: ms-turno

  datasource:
    url: jdbc:mysql://localhost:3306/turno_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: root
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

  cloud:
    openfeign:
      client:
        config:
          default:
            connectTimeout: 3000
            readTimeout: 5000

      compression:
        request:
          enabled: true
        response:
          enabled: true

logging:
  level:
    com.patitas.turno.adapter.out.feign: DEBUG

resilience4j:
  circuitbreaker:
    circuitBreakerAspectOrder: 1
    instances:
      mascotaService:
        registerHealthIndicator: true
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        failureRateThreshold: 50
        waitDurationInOpenState: 10s
        permittedNumberOfCallsInHalfOpenState: 3
        slidingWindowType: COUNT_BASED

      veterinarioService:
        registerHealthIndicator: true
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        failureRateThreshold: 50
        waitDurationInOpenState: 10s
        permittedNumberOfCallsInHalfOpenState: 3
        slidingWindowType: COUNT_BASED

  retry:
    retryAspectOrder: 2
    instances:
      mascotaService:
        maxAttempts: 3
        waitDuration: 1s
        enableExponentialBackoff: true
        exponentialBackoffMultiplier: 2

      veterinarioService:
        maxAttempts: 3
        waitDuration: 1s
        enableExponentialBackoff: true
        exponentialBackoffMultiplier: 2

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,circuitbreakers,circuitbreakerevents

  health:
    circuitbreakers:
      enabled: true

  endpoint:
    health:
      show-details: always
